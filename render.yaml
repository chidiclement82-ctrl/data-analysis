# One-click hosting for live-cartoon/ on Render (https://render.com).
# Render → New → Blueprint → pick this repository. See live-cartoon/README.md.
services:
  - type: web
    name: live-cartoon
    runtime: node
    # "starter" stays on all the time. The free plan falls asleep when nobody
    # visits for 15 minutes, which would drop your TikTok connection.
    plan: starter
    rootDir: live-cartoon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # The password for your cartoon's pages. Render makes up a long random
      # one; find it under Environment after the first deploy.
      - key: CONTROL_KEY
        generateValue: true
      # You fill these in on Render when creating the Blueprint.
      - key: TIKTOK_USERNAME
        sync: false
      # The cartoon's brain. Fill in ONE of these two:
      # GEMINI_API_KEY is free (aistudio.google.com/apikey); ANTHROPIC_API_KEY is Claude (paid).
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CARTOON_NAME
        value: Bobo
      - key: HOST_NAME
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: EULER_API_KEY
        sync: false

  # Secure chat: an end-to-end encrypted customer support chat with its own
  # link (customers at /, the team at /team). See support-chat/README.md.
  - type: web
    name: secure-chat
    runtime: node
    # "starter" keeps chats on a disk and stays awake, so messages arrive
    # straight away. (The free plan has no disk and falls asleep.)
    plan: starter
    rootDir: support-chat
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: secure-chat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      # The team's password for /team. Render makes up a long random one;
      # find it under Environment after the first deploy.
      - key: AGENT_PASSWORD
        generateValue: true
      # You fill these in on Render when creating the Blueprint.
      # The name customers see, e.g. "Bright Bakery Support".
      - key: BRAND_NAME
        sync: false
      # Optional button at the top right, e.g. tel:+2348012345678 and "Call us".
      - key: CONTACT_URL
        sync: false
      - key: CONTACT_LABEL
        sync: false
      - key: RETENTION_DAYS
        value: "30"
