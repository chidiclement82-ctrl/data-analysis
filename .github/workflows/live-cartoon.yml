name: Live cartoon

on:
  pull_request:
    paths: ["live-cartoon/**", ".github/workflows/live-cartoon.yml"]
  push:
    branches: [main]
    paths: ["live-cartoon/**", ".github/workflows/live-cartoon.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-cartoon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live-cartoon/package-lock.json
      - run: npm ci
      - run: npm test
