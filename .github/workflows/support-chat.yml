name: Support chat

on:
  pull_request:
    paths: ["support-chat/**", "assets/js/e2ee.js", ".github/workflows/support-chat.yml"]
  push:
    branches: [main]
    paths: ["support-chat/**", "assets/js/e2ee.js", ".github/workflows/support-chat.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
