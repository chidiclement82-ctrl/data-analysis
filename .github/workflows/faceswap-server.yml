name: Face swap server

on:
  pull_request:
    paths: ["studio-server/**", ".github/workflows/faceswap-server.yml"]
  push:
    branches: [main]
    paths: ["studio-server/**", ".github/workflows/faceswap-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studio-server/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests (stand-in engine, no model weights)
        run: FACESWAP_ENGINE=fake python -m pytest -q tests

  deploy:
    # Uploads the server to your Hugging Face Space. Needs the HF_TOKEN secret and
    # HF_SPACE variable (see studio-server/README.md); skipped until they're set.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN secret (a Hugging Face write token)."; exit 1; fi
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space, repo_type="space", folder_path="studio-server",
              allow_patterns=["Dockerfile", "app.py", "swapper.py", "download_models.py", "requirements.txt", "README.md", ".dockerignore"],
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:8]} from GitHub",
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          PY
