name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          # Every page (*.html) is published, so a new page can't be forgotten here.
          cp -r *.html menu.json robots.txt sitemap.xml site.webmanifest .nojekyll assets flyer _site/
      - name: Make phones load the newest scripts and styles after each update
        run: |
          # Adds ?v=<commit> to our own .css/.js links, so a browser that still
          # remembers the old files fetches the new ones instead.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(assets/[^\"?]+\.(css|js))\"#\1=\"\2?v=$v\"#g" _site/*.html
          grep -o 'assets/[^"]*?v=[^"]*' _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
