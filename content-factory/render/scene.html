<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobo Scene</title>
<style>
  /* One 1080×1920 video frame. The renderer sets the state for each frame
     through window.scene.draw({...}) and takes a screenshot. */
  :root {
    --bg1: #1d1b4b; --bg2: #6a2c91; --accent: #ffcc33;
    --skin: #8a5a3b; --skin-hi: #a8714c; --skin-lo: #6b4429;
    --hair: #17120f; --lip: #5e2f22; --shirt: #ff7a1a; --shirt-lo: #d85f08;
    --ink: #1a1220; --white: #fffaf2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #frame {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 25%, var(--bg2), var(--bg1));
    font-family: "Montserrat", "Arial Black", Arial, sans-serif; color: var(--white);
  }
  .rays { position: absolute; inset: -40%; opacity: 0.12;
    background: repeating-conic-gradient(from 0deg at 50% 45%, #fff 0 6deg, transparent 6deg 18deg); }
  .series { position: absolute; top: 120px; left: 0; right: 0; text-align: center;
    font-size: 44px; font-weight: 900; letter-spacing: 6px; color: var(--accent); text-transform: uppercase; }
  .hook { position: absolute; top: 200px; left: 70px; right: 70px; text-align: center;
    font-size: 78px; line-height: 1.08; font-weight: 900; text-shadow: 0 6px 0 rgb(0 0 0 / 0.35); }
  .caption { position: absolute; left: 60px; right: 60px; top: 1330px; text-align: center;
    font-size: 84px; line-height: 1.1; font-weight: 900; text-transform: uppercase;
    -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; }
  .caption .hot { color: var(--accent); }
  .handle { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 800; opacity: 0.85; }
  .ai { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 28px; opacity: 0.6; }
  #person { position: absolute; left: 90px; top: 520px; width: 900px; height: 1050px; }
</style>
</head>
<body>
<div id="frame">
  <div class="rays" id="rays"></div>
  <div class="series" id="series">Bobo's Daily Push</div>
  <div class="hook" id="hook"></div>

  <svg id="person" viewBox="0 0 600 700" aria-label="Bobo">
    <defs>
      <radialGradient id="skinG" cx="45%" cy="38%" r="70%">
        <stop offset="0" stop-color="var(--skin-hi)"/><stop offset="0.65" stop-color="var(--skin)"/><stop offset="1" stop-color="var(--skin-lo)"/>
      </radialGradient>
      <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--shirt)"/><stop offset="1" stop-color="var(--shirt-lo)"/>
      </linearGradient>
      <clipPath id="mouthClip"><path id="mouthClipPath"/></clipPath>
    </defs>

    <g id="body">
      <!-- shoulders and hoodie -->
      <path d="M40 700 C 40 560, 140 500, 300 500 C 460 500, 560 560, 560 700 Z" fill="url(#shirtG)"/>
      <path d="M220 505 C 240 560, 360 560, 380 505" fill="none" stroke="var(--shirt-lo)" stroke-width="14" stroke-linecap="round"/>
      <path d="M255 545 L 250 640 M 345 545 L 350 640" stroke="var(--white)" stroke-width="8" stroke-linecap="round"/>
      <!-- neck -->
      <path d="M255 420 L 255 515 C 275 535, 325 535, 345 515 L 345 420 Z" fill="var(--skin-lo)"/>
    </g>

    <g id="head">
      <!-- ears -->
      <ellipse cx="148" cy="290" rx="26" ry="40" fill="var(--skin)"/>
      <ellipse cx="452" cy="290" rx="26" ry="40" fill="var(--skin)"/>
      <!-- face -->
      <path d="M300 95 C 410 95, 455 180, 455 280 C 455 380, 395 455, 300 455 C 205 455, 145 380, 145 280 C 145 180, 190 95, 300 95 Z" fill="url(#skinG)"/>
      <!-- hair: short, rounded top -->
      <path d="M150 250 C 140 150, 200 70, 300 70 C 400 70, 462 150, 450 250 C 440 205, 420 170, 395 160 C 360 185, 240 185, 205 160 C 180 170, 160 205, 150 250 Z" fill="var(--hair)"/>
      <g fill="var(--hair)">
        <circle cx="200" cy="120" r="34"/><circle cx="250" cy="92" r="36"/><circle cx="305" cy="84" r="38"/>
        <circle cx="358" cy="92" r="36"/><circle cx="405" cy="122" r="34"/><circle cx="432" cy="165" r="26"/><circle cx="170" cy="162" r="26"/>
      </g>
      <!-- brows -->
      <path id="browL" d="M205 215 Q 240 196 275 210" stroke="var(--hair)" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path id="browR" d="M325 210 Q 360 196 395 215" stroke="var(--hair)" stroke-width="13" stroke-linecap="round" fill="none"/>
      <!-- eyes -->
      <g id="eyes">
        <path d="M200 262 Q 240 226 280 262 Q 240 292 200 262 Z" fill="var(--white)"/>
        <path d="M320 262 Q 360 226 400 262 Q 360 292 320 262 Z" fill="var(--white)"/>
        <g id="irises">
          <circle cx="240" cy="260" r="17" fill="#4a2a17"/><circle cx="240" cy="260" r="8" fill="#120a06"/><circle cx="246" cy="254" r="5" fill="#fff"/>
          <circle cx="360" cy="260" r="17" fill="#4a2a17"/><circle cx="360" cy="260" r="8" fill="#120a06"/><circle cx="366" cy="254" r="5" fill="#fff"/>
        </g>
        <!-- eyelids for blinking -->
        <path id="lidL" stroke="var(--hair)" stroke-width="6" stroke-linecap="round"/>
        <path id="lidR" stroke="var(--hair)" stroke-width="6" stroke-linecap="round"/>
      </g>
      <!-- nose -->
      <path d="M292 290 Q 284 330 270 345 Q 300 360 330 345 Q 316 330 308 290" fill="var(--skin-lo)" opacity="0.55"/>
      <!-- smile lines / cheeks -->
      <ellipse cx="215" cy="330" rx="28" ry="15" fill="#c46a5a" opacity="0.25"/>
      <ellipse cx="385" cy="330" rx="28" ry="15" fill="#c46a5a" opacity="0.25"/>
      <!-- mouth -->
      <g transform="translate(300 392)">
        <path id="mouth" fill="var(--lip)"/>
        <g clip-path="url(#mouthClip)">
          <rect x="-45" y="-30" width="90" height="16" rx="5" fill="var(--white)"/>
          <ellipse id="tongue" cx="0" cy="30" rx="26" ry="14" fill="#d9636f"/>
        </g>
      </g>
    </g>
  </svg>

  <div class="caption" id="caption"></div>
  <div class="handle" id="handle">@yourhandle</div>
  <div class="ai">AI-generated character</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const eyeX = { L: 240, R: 360 };
  // Open: just the upper lash line. Shut: the whole eye covered by skin.
  const lidOpen = (side) => { const c = eyeX[side]; return `M${c - 40} 262 Q ${c} 226 ${c + 40} 262`; };
  const lidShut = (side) => { const c = eyeX[side]; return `M${c - 40} 262 Q ${c} 226 ${c + 40} 262 Q ${c} 292 ${c - 40} 262 Z`; };
  function setLid(id, side, shut) {
    const el = document.getElementById(id);
    el.setAttribute('d', shut ? lidShut(side) : lidOpen(side));
    el.setAttribute('fill', shut ? 'var(--skin)' : 'none');
  }

  // Lips from how open the mouth is (0..1) and how much it smiles (-1..1).
  function mouthPath(open, smile) {
    const w = 58 + smile * 8 - open * 6;
    const corner = -smile * 10;
    const top = -6 - open * 4 + smile * 2;
    const bottom = 8 + open * 52 + Math.max(smile, 0) * 10;
    return `M ${-w} ${corner} Q 0 ${top - 6} ${w} ${corner} Q 0 ${bottom} ${-w} ${corner} Z`;
  }

  window.scene = {
    // state: { hook, caption (with *hot* words), series, handle, open, smile, blink, tilt, nod, browUp, look, t }
    draw(s) {
      if (s.series !== undefined) $('series').textContent = s.series;
      if (s.hook !== undefined) $('hook').textContent = s.hook;
      if (s.handle !== undefined) $('handle').textContent = s.handle;
      if (s.caption !== undefined) {
        $('caption').innerHTML = String(s.caption)
          .replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
          .replace(/\*([^*]+)\*/g, '<span class="hot">$1</span>');
      }
      const open = s.open ?? 0, smile = s.smile ?? 0.4;
      const d = mouthPath(open, smile);
      $('mouth').setAttribute('d', d);
      $('mouthClipPath').setAttribute('d', d);
      $('tongue').setAttribute('cy', String(14 + open * 26));
      setLid('lidL', 'L', s.blink);
      setLid('lidR', 'R', s.blink);
      const up = (s.browUp ?? 0) * -10;
      $('browL').setAttribute('transform', `translate(0 ${up})`);
      $('browR').setAttribute('transform', `translate(0 ${up})`);
      $('irises').setAttribute('transform', `translate(${(s.look ?? 0) * 6} 0)`);
      $('head').setAttribute('transform', `rotate(${s.tilt ?? 0} 300 440) translate(0 ${s.nod ?? 0})`);
      $('rays').style.transform = `rotate(${(s.t ?? 0) * 4}deg)`;
    },
  };
  window.scene.draw({ hook: '', caption: '', open: 0, smile: 0.4 });
</script>
</body>
</html>
