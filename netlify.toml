# Netlify hosts only the secure chat from this repository (see
# support-chat/README.md). The Ogarider website stays on GitHub Pages.
# Paths below are inside the base directory.
[build]
  base = "support-chat"
  publish = "public"
  functions = "netlify/functions"
  command = ""

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

# The pages may only load files from this site and talk to this site.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cache-Control = "no-cache"
