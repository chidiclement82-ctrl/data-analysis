<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ogarider — Nigerian Food, Order on WhatsApp</title>
  <meta name="description" content="Ogarider serves authentic Nigerian food: jollof rice, soups and swallow, suya, pepper soup and cold drinks. Order on WhatsApp and we deliver to you.">
  <meta name="theme-color" content="#1c1512">

  <!-- Site address (custom domain ogarider.name.ng). If it ever changes, update it
       in this file, order.html, robots.txt and sitemap.xml. -->
  <link rel="canonical" href="https://ogarider.name.ng/">

  <!-- Social sharing (link previews on WhatsApp, Facebook, X, iMessage…) -->
  <meta property="og:type" content="restaurant">
  <meta property="og:site_name" content="Ogarider">
  <meta property="og:title" content="Ogarider — FOOD IS READY">
  <meta property="og:description" content="Authentic Nigerian food: jollof rice, soups and swallow, suya and cold drinks. Open daily 8am–7pm. Order on WhatsApp.">
  <meta property="og:url" content="https://ogarider.name.ng/">
  <meta property="og:image" content="https://ogarider.name.ng/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ogarider — FOOD IS READY">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Structured data helps Google show hours and menu in search.
       EDIT: keep name, phone and hours here in step with the page. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "Ogarider",
    "servesCuisine": ["Nigerian", "African"],
    "priceRange": "₦₦",
    "telephone": "+234-705-994-6531",
    "openingHoursSpecification": [
      { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], "opens": "08:00", "closes": "19:00" }
    ],
    "acceptsReservations": "False",
    "url": "https://ogarider.name.ng/",
    "hasMenu": "https://ogarider.name.ng/restaurants.html"
  }
  </script>
</head>
<body>
  <!-- The homepage does one job: send people to order on WhatsApp.
       The background photo is set on the admin page (Homepage photo). -->
  <main class="hero landing" id="main">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="landing-inner">
      <div class="landing-brand">
        <img src="assets/logo-mark.svg" alt="" width="64" height="64">
        <span>Oga<em>rider</em></span>
      </div>
      <h1>FOOD IS READY</h1>
      <div class="landing-actions">
        <a class="btn-landing btn-landing-wa" href="order.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg><span>ORDER ON WHATSAPP</span></a>

  <script src="assets/js/home.js" defer></script>

</html>
